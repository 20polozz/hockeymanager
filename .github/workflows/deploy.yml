name: Desplegar a producció (FTP)

# S'executa cada cop que hi ha un canvi a "main" (i també a mà des d'Actions)
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Pujar canvis via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar el codi
        uses: actions/checkout@v4

      - name: Pujar només els fitxers que han canviat
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Carpeta del domini al servidor, acabada en "/" (ex.: /public_html/ o /web/)
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          # El config.php del servidor no es toca mai (no és al repositori)
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/config.php
